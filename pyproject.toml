[project]
name = "mlphd-bootcamp"
version = "0.1.0"
description = "Browser-compatible exercise helpers for the MLPHD curriculum."
requires-python = ">=3.10"
dependencies = [
  "marimo[sql]>=0.19.7",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlphd_bootcamp"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.py" = ["F541", "I001"]
"scripts/export-curriculum.py" = ["S603", "S607"]
"src/mlphd_bootcamp/exercises.py" = ["S102"]
"tests/**/*.py" = ["S101"]
