[project]
name = "mlphd-bootcamp"
version = "0.1.0"
description = "Browser-compatible exercise helpers for the MLPHD curriculum."
requires-python = ">=3.10"
dependencies = [
  "marimo[sql]>=0.19.7",
  "polars>=1.43.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "watchdog>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlphd_bootcamp"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]

[tool.marimo.runtime]
watcher_on_save = "autorun"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*.py" = ["F541", "I001"]
"notebooks/data-science/python/python-language/*.py" = ["F541", "I001", "S101", "S102"]
"notebooks/data-science/ml-engineering/docker-compose/*.py" = ["F541", "I001", "S101", "S102"]
"notebooks/data-science/algorithms/python-algorithms/*.py" = ["F541", "I001", "S101", "S102"]
"notebooks/data-science/ml-methods/machine-learning-interviews/*.py" = ["F541", "I001", "S101", "S102"]
"notebooks/data-science/mathematics/probability-statistics-interviews/*.py" = ["F541", "I001", "S101", "S102"]
"notebooks/data-science/sql/all_in_one_sql*.py" = ["F401", "S608"]
"scripts/export-curriculum.py" = ["S603", "S607"]
"src/mlphd_bootcamp/exercises.py" = ["S102"]
"tests/**/*.py" = ["S101"]
